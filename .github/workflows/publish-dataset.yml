name: Publish verified AI4S dataset
on:
  push:
    branches: [main]
    paths:
      - '.github/dataset-update/**'
      - '.github/workflows/publish-dataset.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ai4s-dataset-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct, verify all files, and publish
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_DATASET: '1'
        run: python .github/dataset-update/rebuild.py
