name: Publish verified AI4S dataset
on:
  push:
    branches: [main]
    paths:
      - '.github/dataset-update/**'
      - '.github/workflows/publish-dataset.yml'
      - 'data/current_manifest.json'
      - 'reviews/2026-10-27_early/excluded_8.json'
      - 'reviews/2026-10-27_early/out_of_range_PY2027_104.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ai4s-dataset-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify and publish TXT-only dataset
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/dataset-update/rebuild.py
