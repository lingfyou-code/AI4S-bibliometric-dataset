<text x="365.00" y="485.00" font-size="33" fill="#2F6E94" text-anchor="middle" font-weight="700">10,315篇</text>
<line x1="365.00" y1="511.00" x2="365.00" y2="645.00" stroke="#6B7E90" stroke-width="2.3" marker-end="url(#arrow)"/>
