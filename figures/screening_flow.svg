<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1440" viewBox="0 0 1320 1440" role="img" aria-labelledby="title desc">
<title id="title">WoS文献检索与筛选流程</title><desc id="desc">11637→10315→10189→9467→9363；依次移出1322、126、722、104；右侧为剔除或转出。</desc>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif}</style>
