<text x="630" y="251" class="sidehead" text-anchor="start">第一轮：题名摘要初筛与撤稿核查</text>
<text x="630" y="285" class="body" text-anchor="start">未见AI科学任务、纯综述及其他非目标研究：1,318条</text>
<text x="630" y="312" class="body" text-anchor="start">明确撤稿记录：4条</text>
<rect x="610" y="410" width="530" height="180" rx="8" fill="#f7f8fa" stroke="#c3cdd5" stroke-width="1.4"/>
<text x="630" y="441" class="sidehead" text-anchor="start">第二轮：模型辅助初审与领域筛选</text>
<text x="630" y="475" class="body" text-anchor="start">剔除交通、金融、临床及其他非目标研究</text>
<text x="630" y="502" class="body" text-anchor="start">专项排除110条＋落实既有建议18条</text>
<text x="630" y="529" class="body" text-anchor="start">两组重叠2条，按并集移出126条</text>
<text x="630" y="556" class="body" text-anchor="start">模型初审用于定位疑点，本身未新增删除</text>
