<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1530" viewBox="0 0 1400 1530"><title>WoS文献检索与筛选流程</title><desc>合并三轮待定文献复核，所有向右箭头表示未纳入核心样本。原始11637条，最终9475篇。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#546b7b"/></marker></defs><rect width="1400" height="1530" fill="white"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" fill="#243c4c"><text x="700" y="63" text-anchor="middle" font-size="34" font-weight="700" fill="#243c4c">WoS文献检索与筛选流程</text><text x="700" y="103" text-anchor="middle" font-size="21" font-weight="400" fill="#607686">逐轮筛选 · 合并待定文献复核 · 右侧统一列示未纳入文献</text><text x="385" y="153" text-anchor="middle" font-size="22" font-weight="600" fill="#243c4c">保留文献</text><text x="1055" y="153" text-anchor="middle" font-size="22" font-weight="600" fill="#8b5142">剔除 / 转出核心样本</text><rect x="100" y="180" width="570" height="128" rx="10" fill="#f0f5f8" stroke="#96aebb" stroke-width="1.6"/><text x="385" y="216" text-anchor="middle" font-size="25" font-weight="600" fill="#243c4c">原始WoS候选记录</text><text x="385" y="262" text-anchor="middle" font-size="35" font-weight="700" fill="#245c70">11,637条</text><path d="M385 308 V444" fill="none" stroke="#546b7b" stroke-width="2.2" marker-end="url(#a)"/><text x="410" y="334" text-anchor="start" font-size="20" font-weight="600" fill="#243c4c">第一轮：题名摘要初筛与撤稿核查</text><path d="M385 374 H795" fill="none" stroke="#546b7b" stroke-width="2.2" marker-end="url(#a)"/><rect x="805" y="334" width="505" height="150" rx="10" fill="#fbf4f1" stroke="#c8aaa0" stroke-width="1.6"/><text x="830" y="369" text-anchor="start" font-size="22" font-weight="600" fill="#8b5142">未纳入核心样本</text><text x="830" y="403" text-anchor="start" font-size="20" font-weight="400" fill="#243c4c">非目标研究等：1,318条</text><text x="830" y="433" text-anchor="start" font-size="20" font-weight="400" fill="#243c4c">明确撤稿记录：4条</text><text x="830" y="463" text-anchor="start" font-size="20" font-weight="400" fill="#243c4c">本轮共剔除：1,322条</text><rect x="100" y="444" width="570" height="128" rx="10" fill="#f0f5f8" stroke="#96aebb" stroke-width="1.6"/><text x="385" y="480" text-anchor="middle" font-size="25" font-weight="600" fill="#243c4c">初步筛选后保留</text><text x="385" y="526" text-anchor="middle" font-size="35" font-weight="700" fill="#245c70">10,315条</text><path d="M385 572 V708" fill="none" stroke="#546b7b" stroke-width="2.2" marker-end="url(#a)"/><text x="410" y="598" text-anchor="start" font-size="20" font-weight="600" fill="#243c4c">第二轮：模型辅助初审与领域筛选</text><path d="M385 638 H795" fill="none" stroke="#546b7b" stroke-width="2.2" marker-end="url(#a)"/><rect x="805" y="598" width="505" height="150" rx="10" fill="#fbf4f1" stroke="#c8aaa0" stroke-width="1.6"/><text x="830" y="633" text-anchor="start" font-size="22" font-weight="600" fill="#8b5142">未纳入核心样本</text><text x="830" y="667" text-anchor="start" font-size="20" font-weight="400" fill="#243c4c">交通、金融、临床等非目标研究</text><text x="830" y="697" text-anchor="start" font-size="20" font-weight="400" fill="#243c4c">本轮共剔除：126条</text><text x="830" y="727" text-anchor="start" font-size="20" font-weight="400" fill="#243c4c">110＋18－重叠2＝126条</text><rect x="100" y="708" width="570" height="128" rx="10" fill="#f0f5f8" stroke="#96aebb" stroke-width="1.6"/><text x="385" y="744" text-anchor="middle" font-size="25" font-weight="600" fill="#243c4c">领域筛选后保留</text><text x="385" y="790" text-anchor="middle" font-size="35" font-weight="700" fill="#245c70">10,189条</text><path d="M385 836 V972" fill="none" stroke="#546b7b" stroke-width="2.2" marker-end="url(#a)"/><text x="410" y="862" text-anchor="start" font-size="20" font-weight="600" fill="#243c4c">第三轮：科学任务、原创性及出版关系核验</text><path d="M385 902 H795" fill="none" stroke="#546b7b" stroke-width="2.2" marker-end="url(#a)"/><rect x="805" y="862" width="505" height="180" rx="10" fill="#fbf4f1" stroke="#c8aaa0" stroke-width="1.6"/><text x="830" y="897" text-anchor="start" font-size="22" font-weight="600" fill="#8b5142">未纳入核心样本</text><text x="830" y="931" text-anchor="start" font-size="20" font-weight="400" fill="#243c4c">转拓展参考：513篇</text><text x="830" y="961" text-anchor="start" font-size="20" font-weight="400" fill="#243c4c">非目标或非原创：13篇</text><text x="830" y="991" text-anchor="start" font-size="20" font-weight="400" fill="#243c4c">重复合并或撤稿旧版：4篇</text><text x="830" y="1021" text-anchor="start" font-size="20" font-weight="400" fill="#243c4c">本轮共移出：530篇</text><rect x="100" y="972" width="570" height="128" rx="10" fill="#f0f5f8" stroke="#96aebb" stroke-width="1.6"/><text x="385" y="1008" text-anchor="middle" font-size="25" font-weight="600" fill="#243c4c">保留初步核心及待定文献</text><text x="385" y="1054" text-anchor="middle" font-size="35" font-weight="700" fill="#245c70">9,659篇</text><text x="385" y="1083" text-anchor="middle" font-size="19" font-weight="400" fill="#243c4c">初步核心8,247篇 ＋ 待定1,412篇</text><path d="M385 1100 V1236" fill="none" stroke="#546b7b" stroke-width="2.2" marker-end="url(#a)"/><text x="410" y="1126" text-anchor="start" font-size="20" font-weight="600" fill="#243c4c">第四轮：待定文献复核与补证（合并三轮）</text><path d="M385 1166 H795" fill="none" stroke="#546b7b" stroke-width="2.2" marker-end="url(#a)"/><rect x="805" y="1126" width="505" height="180" rx="10" fill="#fbf4f1" stroke="#c8aaa0" stroke-width="1.6"/><text x="830" y="1161" text-anchor="start" font-size="22" font-weight="600" fill="#8b5142">未纳入核心样本</text><text x="830" y="1195" text-anchor="start" font-size="20" font-weight="400" fill="#243c4c">内容排除：150篇（142＋6＋2）</text><text x="830" y="1225" text-anchor="start" font-size="20" font-weight="400" fill="#243c4c">转拓展参考：22篇（20＋1＋1）</text><text x="830" y="1255" text-anchor="start" font-size="20" font-weight="400" fill="#243c4c">证据不足未纳入：12篇</text><text x="830" y="1285" text-anchor="start" font-size="20" font-weight="400" fill="#243c4c">本轮共移出：184篇</text><rect x="100" y="1236" width="570" height="128" rx="10" fill="#e5f1ed" stroke="#659685" stroke-width="1.6"/><text x="385" y="1272" text-anchor="middle" font-size="25" font-weight="600" fill="#243c4c">最终核心分析样本</text><text x="385" y="1318" text-anchor="middle" font-size="35" font-weight="700" fill="#245c70">9,475篇</text><text x="385" y="1347" text-anchor="middle" font-size="19" font-weight="400" fill="#243c4c">8,247 ＋（1,199＋24＋5）＝ 9,475篇</text><text x="100" y="1413" text-anchor="start" font-size="19" font-weight="400" fill="#243c4c">注：第四轮仅复核1,412篇待定文献，8,247篇初步核心样本保留；三轮复核合计纳入1,228篇。</text><text x="100" y="1446" text-anchor="start" font-size="19" font-weight="400" fill="#243c4c">“转拓展参考”与“证据不足未纳入”均不进入核心分析样本，具体处置与内容排除分别标示。</text><text x="100" y="1479" text-anchor="start" font-size="19" font-weight="400" fill="#243c4c">数量核对：11,637－1,322－126－530－184＝9,475。原图样本数量与处置类别均保留。</text></g></svg>