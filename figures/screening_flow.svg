<text x="365.00" y="1235.00" font-size="33" fill="#2F6E94" text-anchor="middle" font-weight="700">9,363篇</text>
<rect x="745.00" y="274.00" width="505.00" height="142.00" fill="#FCF7EF" rx="7" stroke="#D7BC94" />
<text x="766.00" y="303.00" font-size="19" fill="#243448" text-anchor="start" font-weight="700">第一轮：初步筛查与撤稿处理</text>
<text x="766.00" y="333.00" font-size="17" fill="#68594A" text-anchor="start" font-weight="400">非目标、纯综述等：1,318篇</text>
<text x="766.00" y="360.00" font-size="17" fill="#68594A" text-anchor="start" font-weight="400">明确撤稿记录：4篇</text>
<text x="766.00" y="395.00" font-size="19" fill="#A56B2A" text-anchor="start" font-weight="700">本轮剔除：1,322篇</text>
<rect x="745.00" y="524.00" width="505.00" height="142.00" fill="#FCF7EF" rx="7" stroke="#D7BC94" />
<text x="766.00" y="553.00" font-size="19" fill="#243448" text-anchor="start" font-weight="700">第二轮：模型辅助初审与领域筛选</text>
<text x="766.00" y="583.00" font-size="17" fill="#68594A" text-anchor="start" font-weight="400">交通、金融、临床诊疗等</text>
<text x="766.00" y="610.00" font-size="17" fill="#68594A" text-anchor="start" font-weight="400">不符合研究范围的文献</text>
<text x="766.00" y="645.00" font-size="19" fill="#A56B2A" text-anchor="start" font-weight="700">本轮剔除：126篇</text>
<rect x="745.00" y="774.00" width="505.00" height="142.00" fill="#FCF7EF" rx="7" stroke="#D7BC94" />
<text x="766.00" y="803.00" font-size="19" fill="#243448" text-anchor="start" font-weight="700">第三轮：内容、原创性与出版关系核验</text>
<text x="766.00" y="833.00" font-size="17" fill="#68594A" text-anchor="start" font-weight="400">内容排除、转拓展及资格证据不足</text>
<text x="766.00" y="860.00" font-size="17" fill="#68594A" text-anchor="start" font-weight="400">重复 / 撤稿旧版；含早期复核8篇</text>
<text x="766.00" y="895.00" font-size="19" fill="#A56B2A" text-anchor="start" font-weight="700">本轮剔除或转出：722篇</text>
<rect x="745.00" y="1024.00" width="505.00" height="142.00" fill="#FCF7EF" rx="7" stroke="#D7BC94" />
<text x="766.00" y="1053.00" font-size="19" fill="#243448" text-anchor="start" font-weight="700">第四轮：出版年份范围核对</text>
<text x="766.00" y="1083.00" font-size="17" fill="#68594A" text-anchor="start" font-weight="400">全样本统一采用出版年PY</text>
<text x="766.00" y="1110.00" font-size="17" fill="#68594A" text-anchor="start" font-weight="400">移出PY为2027的范围外记录</text>
<text x="766.00" y="1145.00" font-size="19" fill="#A56B2A" text-anchor="start" font-weight="700">本轮移出：104篇</text>
<text x="60.00" y="1328.00" font-size="20" fill="#2F6E94" text-anchor="start" font-weight="700">数量核对：11,637－1,322－126－722－104＝9,363篇。</text>
<text x="60.00" y="1367.00" font-size="17" fill="#63758A" text-anchor="start" font-weight="400">注：按最终处置汇总筛选步骤；疑点文献在候选池内核验，符合标准者保留在主线。</text>
<text x="60.00" y="1401.00" font-size="17" fill="#63758A" text-anchor="start" font-weight="400">第三轮包括早期复核；转拓展参考不计主分析，资格证据不足与内容不相关分别记录。</text>
</svg>
