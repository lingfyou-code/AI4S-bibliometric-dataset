<text x="610" y="1691.25" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="normal">9,992＝10,304－312</text>
<text x="610" y="1728.75" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="normal">构成：其余保留9,967篇＋争议复核保留25篇</text>
<text x="950" y="1800.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="normal">注：按最终记录归并展示；3.3%为争议子集占比，不是双人一致性系数。</text>
