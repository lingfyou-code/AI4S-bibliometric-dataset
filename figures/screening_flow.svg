<text x="630" y="690" class="body" text-anchor="start">初步核心：8,247篇；待定：1,412篇</text>
<text x="630" y="717" class="body" text-anchor="start">拓展参考：513篇</text>
<text x="630" y="744" class="body" text-anchor="start">非目标或非原创排除：13篇</text>
<text x="630" y="771" class="body" text-anchor="start">重复合并或撤稿旧版移除：4篇</text>
