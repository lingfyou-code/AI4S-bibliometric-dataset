<text x="1470.0" y="983.75" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="normal">研究范围及AI参与筛查后剔除 976 篇</text>
<text x="1470.0" y="1021.25" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="normal">经济金融、教育教学、临床诊疗等范围外应用，</text>
<text x="1470.0" y="1058.75" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="normal">或未实际使用机器学习、深度学习、</text>
<text x="1470.0" y="1096.25" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="normal">大语言模型等AI方法参与研究</text>
