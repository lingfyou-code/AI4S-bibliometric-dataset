<text x="1470.0" y="481.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="normal">PY字段不在2010—2026年（含首尾）</text>
