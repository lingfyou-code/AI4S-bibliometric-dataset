<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1810" viewBox="0 0 1200 1810" role="img" aria-labelledby="title desc">
<title id="title">WoS文献检索与筛选流程：11,637条至9,475篇核心样本</title>
<desc id="desc">原始记录经初筛保留10,315条，领域筛选保留10,189条，形成初步核心8,247篇；两轮补证后核心9,470篇，本轮20篇续核新增5篇，最终核心9,475篇，12篇按用户决定单列为证据不足未纳入，当前待核验池为0。</desc>
