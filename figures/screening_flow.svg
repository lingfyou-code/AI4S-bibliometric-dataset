<text x="630" y="950" class="body" text-anchor="start">核对AI方法、科学任务与原创研究证据</text>
<text x="630" y="977" class="body" text-anchor="start">纳入1,199篇；排除142篇</text>
<text x="630" y="1004" class="body" text-anchor="start">转拓展参考20篇；仍待补证51篇</text>
<rect x="610" y="1115" width="530" height="170" rx="8" fill="#f7f8fa" stroke="#c3cdd5" stroke-width="1.4"/>
<text x="630" y="1146" class="sidehead" text-anchor="start">第五轮：补充证据核查</text>
<text x="630" y="1180" class="body" text-anchor="start">补查出版社、作者稿及公开方法资料</text>
<text x="630" y="1207" class="body" text-anchor="start">纳入24篇；排除6篇；转拓展参考1篇</text>
<text x="630" y="1234" class="body" text-anchor="start">20篇仍待补证，未计入核心</text>
<rect x="610" y="1345" width="530" height="170" rx="8" fill="#f7f8fa" stroke="#c3cdd5" stroke-width="1.4"/>
<text x="630" y="1376" class="sidehead" text-anchor="start">第六轮：20篇待补证文献续核</text>
<text x="630" y="1410" class="body" text-anchor="start">补查出版社方法片段、公开全文及作者稿</text>
<text x="630" y="1437" class="body" text-anchor="start">纳入5篇；排除2篇；转拓展参考1篇</text>
<text x="630" y="1464" class="body" text-anchor="start">12篇单列为“证据不足未纳入”</text>
<rect x="60" y="1620" width="1080" height="90" rx="8" fill="#f7f8fa" stroke="#c3cdd5" stroke-width="1.4"/>
<text x="80" y="1652" class="sidehead" text-anchor="start">当前分区核对（共10,189条）</text>
<text x="80" y="1686" class="body" text-anchor="start">核心9,475＋拓展535＋证据不足未纳入12＋内容排除163＋质量移除4＝10,189条</text>
<text x="60" y="1750" class="sub" text-anchor="start">注：8,247篇以后为核心样本量；后续复核将符合要求的待定文献补入。</text>
<text x="60" y="1778" class="sub" text-anchor="start">本次样本处置已确定；证据不足12篇单列，当前待核验池为0。更新日期：2026-10-23。</text>
