<text x="610.0" y="884.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="32" font-weight="normal">n = 10,993</text>
<line x1="610" y1="915" x2="610" y2="1220" stroke="black" stroke-width="3"/><polygon points="610,1220 601,1203 619,1203" fill="black"/>
